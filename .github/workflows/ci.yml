name: ci
# Runs on pull requests and on demand only (no surprise runs on every push).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PW_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: System tools for spike tests (pandoc, unzip)
        run: sudo apt-get update && sudo apt-get install -y pandoc unzip
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: npm ci --prefix spikes/editor-export
      - name: Start user-owned PostgreSQL (no TCP)
        run: |
          eval "$(sh infra/dev/pg-dev.sh start)"
          echo "PW_TEST_DATABASE_URL=$PW_TEST_DATABASE_URL" >> "$GITHUB_ENV"
      - run: pnpm test
